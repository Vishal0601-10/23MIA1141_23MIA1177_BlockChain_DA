services:
  # ------------------------------------------------------------
  # Kafka: event backbone
  # Internal clients use kafka:9092.
  # Host-side TATKAL-X app can use localhost:29092.
  # ------------------------------------------------------------
  kafka:
    image: apache/kafka:4.3.1
    container_name: tatkal-x-kafka
    restart: unless-stopped
    ports:
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list >/dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  # ------------------------------------------------------------
  # Real-time stream processor
  # ------------------------------------------------------------
  stream_processor:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tatkal-x-stream-processor
    restart: unless-stopped
    command: ["python", "stream_processor.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: tatkal-x-events
      KAFKA_GROUP_ID: tatkal-x-stream-processor
      STREAM_WINDOW_SIZE: 20
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------
  # Persistent SQLite event storage
  # ------------------------------------------------------------
  stream_storage:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tatkal-x-stream-storage
    restart: unless-stopped
    command: ["python", "stream_storage.py"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: tatkal-x-events
      KAFKA_GROUP_ID: tatkal-x-persistent-storage
      TATKAL_X_DB: /app/data/tatkal_x_stream.db
    volumes:
      - tatkal_data:/app/data
    depends_on:
      kafka:
        condition: service_healthy

  # ------------------------------------------------------------
  # Interactive analytics API / UI
  # ------------------------------------------------------------
  analytics:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: tatkal-x-analytics
    restart: unless-stopped
    command: ["python", "analytics_api_interactive.py"]
    environment:
      TATKAL_X_DB: /app/data/tatkal_x_stream.db
      ANALYTICS_HOST: 0.0.0.0
      ANALYTICS_PORT: 5001
    ports:
      - "5001:5001"
    volumes:
      - tatkal_data:/app/data
    depends_on:
      - stream_storage

volumes:
  kafka_data:
  tatkal_data:
